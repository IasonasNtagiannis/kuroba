<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: approved-homepage.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Varta:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#181818}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-field-noise region texture" data-region="field-noise" style="background-image:url('../../../assets/plates/field-noise.png');background-repeat:repeat"></div>
  <div class="r-wordmark region text" data-region="wordmark"><!-- Kuroba wordmark in warm-white sans. --><p style="font-size:var(--r-wordmark-font);line-height:1.05;margin:0">wordmark</p></div>
  <div class="r-nav-links region text" data-region="nav-links"><!-- Three evenly spaced navigation labels: Work, About, and How we work. --><p style="font-size:var(--r-nav-links-font);line-height:1.05;margin:0">nav-links</p></div>
  <div class="r-nav-cta region control" data-region="nav-cta"><!-- Outline project action in header.: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav-cta); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-hero-heading region text" data-region="hero-heading"><!-- Three-line studio proposition in warm white, large sans. --><p style="font-size:var(--r-hero-heading-font);font-family:var(--r-hero-heading-family),sans-serif;font-weight:var(--r-hero-heading-weight);line-height:1.05;margin:0">hero-heading</p></div>
  <div class="r-hero-support region text" data-region="hero-support"><!-- Three-line supporting statement in warm-white sans. --><p style="font-size:var(--r-hero-support-font);line-height:1.05;margin:0">hero-support</p></div>
  <div class="r-hero-cta region control" data-region="hero-cta"><!-- Filled vermilion project action.: rebuild the control's chrome from the crop (comp-spec.mjs --crop hero-cta); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-hero-secondary region control" data-region="hero-secondary"><!-- Outline secondary action.: rebuild the control's chrome from the crop (comp-spec.mjs --crop hero-secondary); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-feather-mark region plate" data-region="feather-mark"><img src="../../../assets/plates/feather-mark.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-service-divider region chrome" data-region="service-divider"><!-- Fine horizontal rule above the service rail. --></div>
  <div class="r-service-one-number region text" data-region="service-one-number"><!-- Seven-segment 01 in vermilion. --><p style="line-height:1.05;margin:0">service-one-number</p></div>
  <div class="r-service-one-label region text" data-region="service-one-label"><!-- Product design label. --><p style="font-size:var(--r-service-one-label-font);line-height:1.05;margin:0">service-one-label</p></div>
  <div class="r-service-one-separator region chrome" data-region="service-one-separator"><!-- Thin vertical rule between service cells. --></div>
  <div class="r-service-two-number region text" data-region="service-two-number"><!-- Seven-segment 02 in amber. --><p style="line-height:1.05;margin:0">service-two-number</p></div>
  <div class="r-service-two-label region text" data-region="service-two-label"><!-- Full-stack engineering label. --><p style="font-size:var(--r-service-two-label-font);line-height:1.05;margin:0">service-two-label</p></div>
  <div class="r-service-two-separator region chrome" data-region="service-two-separator"><!-- Thin vertical rule between service cells. --></div>
  <div class="r-service-three-number region text" data-region="service-three-number"><!-- Seven-segment 03 in subdued ghost segments. --><p style="font-size:var(--r-service-three-number-font);line-height:1.05;margin:0">service-three-number</p></div>
  <div class="r-service-three-label region text" data-region="service-three-label"><!-- Cloud infrastructure label. --><p style="font-size:var(--r-service-three-label-font);line-height:1.05;margin:0">service-three-label</p></div>
</main>
</body>
</html>
